[project]
name = "repo-index"
version = "0.1.0"
description = "CLI tools for indexing source repositories and preparing code chunks for retrieval."
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

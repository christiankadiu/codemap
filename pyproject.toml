[build-system]
requires = ["setuptools>=66", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "codemap"
version = "0.1.0"
description = "Command line tool for indexing and searching source repositories."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codemap = "cli:main"

[tool.setuptools]
py-modules = [
    "answers",
    "chunker",
    "cli",
    "config",
    "context",
    "indexer",
    "languages",
    "loader",
    "provider_input",
    "providers",
    "responses",
    "scanner",
    "search",
    "stats",
    "status",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

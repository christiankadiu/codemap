[build-system]
requires = ["setuptools>=66", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "codemap"
version = "0.2.0"
description = "Command line tool for indexing and searching source repositories."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.26,<3", "pathspec>=0.12,<2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]

[project.scripts]
codemap = "codemap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codemap*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: optional real local embedding model checks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
